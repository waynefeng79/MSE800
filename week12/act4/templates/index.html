<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; text-align: center; }
        .upload-box { margin-bottom: 30px; padding: 20px; border: 2px dashed #ccc; display: inline-block; }
        .preview-box { margin-top: 20px; }
        img { max-width: 500px; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h2>Upload and Display an Image</h2>

    <div class="upload-box">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <br><br>
            <button type="submit">Upload Image</button>
        </form>
    </div>

    {% if filename %}
        <div class="preview-box">
            <h3>Uploaded Image Preview:</h3>
            <img src="{{ url_for('display_image', filename=filename) }}" alt="Uploaded User Image">
            <p>Filename: {{ filename }}</p>
        </div>
    {% endif %}

</body>
</html>
